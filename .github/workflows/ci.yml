name: Second Chance CI (Gate 0)

on:
  push:
    branches: [ main, "aryan/**", "shashank/**", "atul/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite (Gate 0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite (Gate 0 Proof)
        run: |
          cd backend
          python -m pytest -q

      - name: Run Evaluation Profile Regression
        run: |
          python evaluation/run.py

  frontend-build:
    name: Frontend Build (Gate 0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application (Gate 0 Proof)
        working-directory: frontend
        run: npm run build
